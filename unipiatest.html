<!doctype html>
<html lang="en">
<head>

<style>
  @media screen and (max-width: 620px){
    .container{ width:100% !important; }
    .fluid { width:100% !important; height:auto !important; }
    .btn-img { width:140px !important; height:auto !important; }
    .hint-img { width:160px !important; height:auto !important; }
  }
  img{ border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; display:block; }

<body style="margin:0;padding:0;background:#f4f4f4;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!-- 컨테이너 -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               class="container"
               style="width:600px;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">

          <!-- 메인 이미지 (버튼 없는 배경) -->
          <tr>
            <td align="center" style="padding:0;">
              <img src="https://jsm1007.github.io/unipia1/HTML_png1.5.png" 
                   width="600" 
                   class="fluid"
                   alt="UNIPIA" 
                   style="display:block;width:600px;max-width:600px;height:auto;">
            </td>
          </tr>

          <!-- 상단 스토어 버튼 영역 -->
          <tr>
            <td align="center" style="padding:20px 24px 10px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">

                  <td align="center" style="padding:0 8px;">
                    <a href="https://play.google.com/store/apps/details?id=com.unipia.unipia&hl=en_GB" target="_blank">
                      <img src="https://jsm1007.github.io/unipia1/google.png" 
                           width="166" 
                           class="btn-img"
                           alt="Get it on Google Play" 
                           style="display:block;width:166px;height:auto;">
                    </a>
                  </td>
                  <td align="center" style="padding:0 8px;">
                    <a href="https://apps.apple.com/kr/app/unipia-uk-student-community/id1608830229?l=en_GB" target="_blank">
                      <img src="https://jsm1007.github.io/unipia1/Apple.png" 
                           width="147" 
                           class="btn-img"
                           alt="Download on the App Store" 
                           style="display:block;width:147px;height:auto;">
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- 힌트 버튼 -->
          <tr>
            <td align="center" style="padding:10px 24px 20px 24px;">
              <a href="https://unipia.uk/post/?id=1206" target="_blank">

                     width="180" 
                     class="hint-img"
                     alt="See location hint" 
                     style="display:block;width:180px;height:auto;margin:0 auto;">
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:18px 24px;background:#ffffff;">
              <p style="margin:0;font-size:11px;line-height:1.6;color:#999999;">
                © 2026 UNIPIA LTD. All rights reserved.
              </p>

          </tr>

        </table>
      </td>
    </tr>
