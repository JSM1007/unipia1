<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>UNIPIA</title>

<!--[if mso]>
<style>
  body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->

<style>
  @media screen and (max-width: 620px){
    .container{ width:100% !important; }
    .main-img { width:100% !important; height:auto !important; }
  }
  img{ border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; display:block; }
  a{ text-decoration:none; }
</style>
</head>

<body style="margin:0;padding:0;background:#f4f4f4;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!-- 컨테이너 -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               class="container"
               style="width:600px;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">

          <!-- 메인 이미지 (버튼 포함) + 이미지 맵 -->
          <tr>
            <td align="center" style="padding:0;">
              <img src="https://jsm1007.github.io/unipia1/HTML_png.png" 
                   width="600" 
                   class="main-img"
                   alt="UNIPIA - App for UCL students" 
                   style="display:block;width:600px;max-width:600px;height:auto;"
                   usemap="#unipia-map">
              
              <map name="unipia-map">
                <!-- 상단 Google Play 버튼: x=133, y=373, width=166, height=50 -->
                <area shape="rect" coords="133,373,299,423" 
                      href="https://play.google.com/store/apps/details?id=com.unipia.unipia&hl=en_GB" 
                      target="_blank" alt="Get it on Google Play">
                
                <!-- 상단 App Store 버튼: x=321, y=373, width=147, height=50 -->
                <area shape="rect" coords="321,373,468,423" 
                      href="https://apps.apple.com/kr/app/unipia-uk-student-community/id1608830229?l=en_GB" 
                      target="_blank" alt="Download on the App Store">
                
                <!-- 힌트 버튼: x=211, y=1709, width=180, height=48 -->
                <area shape="rect" coords="211,1709,391,1757" 
                      href="https://unipia.uk/post/?id=1206" 
                      target="_blank" alt="See location hint">
                
                <!-- 하단 Google Play 버튼: x=133, y=1902, width=166, height=50 -->
                <area shape="rect" coords="133,1902,299,1952" 
                      href="https://play.google.com/store/apps/details?id=com.unipia.unipia&hl=en_GB" 
                      target="_blank" alt="Get it on Google Play">
                
                <!-- 하단 App Store 버튼: x=321, y=1902, width=147, height=50 -->
                <area shape="rect" coords="321,1902,468,1952" 
                      href="https://apps.apple.com/kr/app/unipia-uk-student-community/id1608830229?l=en_GB" 
                      target="_blank" alt="Download on the App Store">
              </map>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:18px 24px;background:#ffffff;">
              <p style="margin:0;font-size:11px;line-height:1.6;color:#999999;">
                © 2026 UNIPIA LTD. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
